<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A house with a warm window, a plant and a mug">
  <defs>
    <linearGradient id="ah-window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d9e7" />
      <stop offset="1" stop-color="#cb72aa" />
    </linearGradient>
  </defs>

  <!-- roof -->
  <path d="M112 138L200 72l88 66" fill="none" stroke="#717790" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round" />

  <!-- body -->
  <path d="M130 138h140v110H130z" fill="#717790" />
  <path d="M130 138h140v110H130z" fill="none" stroke="#5d6377" stroke-width="2" />

  <!-- window -->
  <rect x="152" y="160" width="60" height="52" rx="5" fill="url(#ah-window)" />
  <g stroke="#f6f5f7" stroke-width="3" opacity=".85">
    <path d="M182 160v52" />
    <path d="M152 186h60" />
  </g>

  <!-- door -->
  <path d="M232 248v-52a14 14 0 0128 0v52z" fill="#cb72aa" opacity=".9" />
  <circle cx="240" cy="222" r="3.5" fill="#f6f5f7" />

  <!-- chimney with curl of smoke -->
  <path d="M252 106v-24h16v38" fill="#717790" />
  <path d="M260 68c9-5 2-13 10-17s13 5 9 11" fill="none" stroke="#c9c8ce"
        stroke-width="3" stroke-linecap="round" opacity=".8" />

  <!-- plant -->
  <path d="M92 248v-34" stroke="#5d6377" stroke-width="3" stroke-linecap="round" />
  <path d="M92 220c-6-13-19-15-22-7-3 9 10 15 22 7z" fill="#cb72aa" opacity=".75" />
  <path d="M92 228c7-14 21-15 24-6 3 9-11 15-24 6z" fill="#cb72aa" opacity=".55" />
  <path d="M92 206c-4-12 3-22 9-20 6 3 3 14-9 20z" fill="#cb72aa" opacity=".65" />
  <path d="M78 248h28l-4 22H82z" fill="#e4c4d8" />

  <!-- mug -->
  <rect x="300" y="222" width="30" height="26" rx="5" fill="#e9e9e9" />
  <path d="M330 230h9a7 7 0 010 12h-9" fill="none" stroke="#e9e9e9" stroke-width="4" />
  <path d="M308 214c5-4 0-9 4-12" fill="none" stroke="#c9c8ce" stroke-width="2.5"
        stroke-linecap="round" opacity=".9" />

  <!-- ground -->
  <path d="M64 272h272" stroke="#e0dfe3" stroke-width="4" stroke-linecap="round" />
</svg>
